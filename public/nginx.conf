server {
    listen 80;
    server_name dolores.danielhpp.duckdns.org;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self';" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy Binance P2P API to bypass CORS
    location /api/binance {
        proxy_pass https://p2p.binance.com/bapi/c2c/v2/friendly/c2c/adv/search;
        proxy_set_header Host p2p.binance.com;
        proxy_set_header Origin "https://p2p.binance.com";
        proxy_ssl_server_name on;
    }

    # Serve Static JSON Data (generated by worker)
    location /api/rates {
        alias /data/rates.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    location /api/history {
        alias /data/history.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # Cache PWA assets (Images, JS, JSON)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|json)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Service Worker should not be cached aggressively
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}
